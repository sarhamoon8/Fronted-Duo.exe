sonar.projectKey=filacero-frontend
sonar.projectName=FilaCero Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=app,src
sonar.tests=app,src,e2e,integration
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.ts,integration/**/*.ts

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/test-results/**,**/playwright-report/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,e2e/**,integration/**,src/presentation/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
