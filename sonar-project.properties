sonar.projectKey=filacero-frontend
sonar.projectName=FilaCero Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=app,src
sonar.tests=app,src,e2e,integration
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.ts,integration/**/*.ts

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/test-results/**,**/playwright-report/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,e2e/**,integration/**,src/presentation/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# css:S4662 ("unknown at-rule") es un falso positivo en app/globals.css:
# @theme es una directiva válida de Tailwind CSS v4 (define design tokens),
# pero el analizador genérico de CSS de SonarQube no la reconoce todavía.
# No hay nada que corregir en el código — cambiar @theme rompería los
# estilos. Documentado también en el commit que agrega esta exclusión.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=app/globals.css
